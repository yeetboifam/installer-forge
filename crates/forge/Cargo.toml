[package]
name = "forge"
version = "0.1.0"
edition = "2021"

[dependencies]
forgefmt = { path = "../forgefmt" }
forgeserver = { path = "../forgeserver" }
eframe = "0.27"
egui = "0.27"
rfd = "0.14"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The GUI build doesn't benefit from the tiny-binary release profile and it
# makes iteration slow, so give it a normal optimized build.
